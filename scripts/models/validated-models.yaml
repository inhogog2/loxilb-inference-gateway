# scripts/models/validated-models.yaml — the supported-models manifest (single source).
#
# docs/SUPPORTED-MODELS.md is rendered from this file and scripts/models/install-models.sh installs from it;
# `scripts/models/modelctl.py check` fails when either, or any committed artifact this file pins, disagrees.
#
# A row is one model on one engine version. States:
#   validated   supported. Needs every evidence gate of the surfaces it claims at "pass", an engine entry the
#               support catalog has validated, and a reviewed change by the code owners. A green run never
#               promotes a row by itself.
#   candidate   has evidence, not promoted, not supported. Installed only with --include-candidates.
#   blocked     refused, with a typed reason and the detail.
# Evidence gates (pass | fail | not_run | n_a; not_run is not a pass):
#   renderDifferential  gateway render + tokenization vs the engine's serving path over the probe corpus
#   pdChat              live prefill/decode pair: READY through the attestation ladder, exact hits on chat, twice
#   pdCompletions       the same on the completions surface
#   abPerf              a measured A/B point against round-robin on the same fleet; "pass" needs the numbers in
#                       the row's `perf` list (three repetitions, all integrity gates held), and the numbers need
#                       "pass". Every validated row carries one.
# Add a model: see "Adding or updating a model" in the generated page.

schemaVersion: models.loxilb.io/v1alpha1

engines:
  - engine: vllm
    version: v0.28.0
    contract: vllm-kv-map-v2
    image: vllm/vllm-openai
    digest: sha256:61fc8a896b0a4fbbbdc063bc4b0dbc25ce98e02b5050c24aeb7830ac02039b14
  - engine: sglang
    version: v0.5.18
    contract: sglang-kv-rank-v1
    image: lmsysorg/sglang
    digest: sha256:9e148f5ac788e856a06166bd6347a831831eb9fcfab4d1770874823a7c29a1a1
  - engine: trtllm
    version: 1.3.0rc24
    contract: trtllm-kv-http-preview-v1
    digest: sha256:a867619fd56c85225927dac27e2111ae90ff66e23c59d9c5f8b9f345577cab6d
    imageNote: "locally built from the release wheel (no registry image)"

launchAll:
  - "vLLM: `PYTHONHASHSEED=0` on the engine and `LLB_KV_NONE_HASH_SEED=0` on the gateway; without it the attestation challenge never completes."
  - "Models whose chat template prints the date (Llama-3.2, gpt-oss): run the engine in UTC — no `TZ`, no host `/etc/localtime` mount."
  - "SGLang: `--model-path <snapshot path> --revision <revision>`. A hub id makes the engine load a different tokenizer pre-tokenizer on some models, and a path without `--revision` fails the gateway's identity probe."
  - "KV block size 16 (`--block-size 16` on vLLM, page size 16 on SGLang), matching the rule's `kvBlockSize`."
  - "SGLang: wait for the engine's `The server is fired up` log line before sending traffic; `/v1/models` answers earlier. The first prompt longer than one 16-token page after a start in a fresh container compiles a hashing extension (about 8 s on a 4-core node) and requests wait for it: mount a host directory at `/root/.cache/torch_extensions` so it is built once per node and image, and send one long prompt to every engine before taking traffic."
  - "SGLang prefill/decode: start the decode engines with `--disaggregation-decode-enable-radix-cache` (recommended). A decode engine then keeps the prefixes it received, and a request whose prefix it holds transfers about 1 MB instead of the whole prefix (93 MB without it, 0.7 MB with it, measured on DeepSeek-R1-Distill-Qwen-1.5B with a long shared prefix). SGLang v0.5.18 refuses the argument at start for models with sliding-window attention or state-space layers: the rows above name the models it was refused for. Not measured for Qwen3.6-27B-FP8 and gpt-oss-20b."
  - "Prefill/decode, every engine: the prompt's KV travels from the prefill node to the decode node, so the sending node's network egress bounds the rate of requests whose prefix the decode engine does not hold: (prefill nodes x egress bytes per second) / (KV bytes of one prompt). Measured: 424 MB per prompt from two prefill nodes limited to 2 Gbit/s each gave 1.08 requests per second."
  - "Prefill/decode, every engine: the gateway chooses the decode engine without regard to which one holds a prefix, so a shared prefix is transferred whole once per decode engine, not once per fleet. A conversation whose client sends `X-Conversation-Id` stays on one prefill/decode pair and pays one whole transfer (such a request is routed by the conversation, not by KV-exact selection). Sending each shared prefix once through every decode engine before taking traffic removes the cost."

excludedFeatures:
  - "Tools: `tools`, `tool_choice`."
  - "Fields that change the rendered prompt: `chat_template`, `chat_template_kwargs`, `documents`, `reasoning_effort`, `add_generation_prompt` other than the profile's value, `continue_final_message`, `add_special_tokens`, `truncate_prompt_tokens`."
  - "Pre-tokenized or embedded prompts: `prompt_token_ids`, `prompt_embeds`; `cache_salt`."
  - "Multimodal content parts, and a message with more than one text part (the engines join them differently)."
  - "A conversation that ends on an assistant message."
  - "On templates that iterate content parts: a message whose render differs between string and list content."

