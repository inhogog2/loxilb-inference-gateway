# LoxiLB Inference Gateway alert rules.
#
# Severity model: critical = page, warning = ticket, info = annotation only.
# Every ratio alert carries a traffic guard so an idle system can never fire (0/0).
#
# SITE TUNABLES (reference-deployment defaults; adjust per site):
#   TTFB p95 threshold ..................... 2s     (LoxilbHighTTFB)
#   AI rate-limit spike .................... 10/s   (LoxilbAIRateLimitSpike)
#   Firewall drop surge .................... 100/s  (LoxilbFwDropSurge)
#   CPU/Mem high ........................... 90%    Disk high/critical ... 90% / 95%
#   Conntrack utilization warn/critical .... 80% / 95%
#   Half-close oldest hold ................. max(1h, 2 x the idle bound)  (LoxilbHalfCloseHoldLongLived)

groups:
  - name: loxilb-availability
    rules:
      - alert: LoxilbScrapeDown
        expr: up{job="loxilb"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "loxilb metrics endpoint unreachable on {{ $labels.instance }}"
          description: >-
            Scrape failing for 1m. NOTE: loxilb answers 503 while Prometheus
            collection is disabled — check POST /netlox/v1/config/metrics before
            assuming a process/network failure. Also verify mTLS certs are valid.
          dashboard: "LoxiLB / Overview"
          panel: "Gateway up"

      - alert: LoxilbNoHealthyEndpoints
        expr: loxilb_healthy_endpoints == 0 and loxilb_lb_rules > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "No healthy endpoints behind any LB rule"
          description: "LB rules exist but every endpoint is unhealthy — traffic is being blackholed."
          dashboard: "LoxiLB / Overview"
          panel: "Healthy endpoints"

      - alert: LoxilbUnhealthyEndpoints
        expr: loxilb_unhealthy_endpoints > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} endpoint(s) unhealthy for 5m"
          dashboard: "LoxiLB / L4 Load Balancer"
          panel: "Endpoint load distribution"

  - name: loxilb-errors
    rules:
      - alert: LoxilbHigh5xxRatio
        expr: >-
          (
            sum(rate(loxilb_proxy_http_responses_by_status_total{status_class="5xx"}[5m]))
            /
            sum(rate(loxilb_proxy_http_responses_total[5m]))
          ) > 0.05
          and sum(rate(loxilb_proxy_http_responses_total[5m])) > 1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "L7 5xx ratio above 5% for 5m"
          dashboard: "LoxiLB / L7 Proxy"
          panel: "Responses/s by status class"

      - alert: LoxilbElevated5xxRatio
        expr: >-
          (
            sum(rate(loxilb_proxy_http_responses_by_status_total{status_class="5xx"}[5m]))
            /
            sum(rate(loxilb_proxy_http_responses_total[5m]))
          ) > 0.01
          and sum(rate(loxilb_proxy_http_responses_total[5m])) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "L7 5xx ratio above 1% for 10m"
          dashboard: "LoxiLB / L7 Proxy"
          panel: "Responses/s by status class"

      - alert: LoxilbL4ErrorBurst
        # Event-driven, unsampled source (loxilb_l4_error_events_total) — bumped by
        # the CT state machine on every error transition, independent of L4 trace.
        # Supersedes the old loxilb_errors_total, which sweep-sampled conntrack
        # state every 10s and missed short-lived error bursts entirely.
        # Benign client RSTs (reason="rst_client") are EXCLUDED: only backend RSTs,
        # TCP protocol errors, and SCTP abort/error indicate a real problem. Rate
        # threshold (not >0) so routine one-off backend resets don't page.
        # INTERIM THRESHOLD (finding F13/D6): the CT state machine currently
        # classifies normal short-lived / management-plane connection teardown as
        # reason="error" (~3.5 events per REST call; 6-30/s under ordinary short-
        # connection load), so the original >1/s threshold fires permanently.
        # Held at >50/s until the llb_kern_ct.c classification fix lands, then
        # restore to >1/s and for: 10m.
        expr: sum(rate(loxilb_l4_error_events_total{reason!="rst_client"}[5m])) > 50
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "L4 backend-error burst (>50/s server-RST/proto-err/SCTP-abort for 15m)"
          description: "Event-driven loxilb_l4_error_events_total (excl. benign client RSTs). A sustained burst points to backend resets, protocol errors, or SCTP aborts. CAVEAT (F13): short-lived/management-plane teardown currently also counts as reason=\"error\", inflating this rate; threshold is interim-raised until the kernel-side classification fix lands."
          dashboard: "LoxiLB / Overview"
          panel: "Error rate"

      - alert: LoxilbHighTTFB
        expr: >-
          histogram_quantile(0.95,
            sum by (le) (rate(loxilb_proxy_http_ttfb_seconds_bucket[5m]))
          ) > 2
          and sum(rate(loxilb_proxy_http_responses_total[5m])) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "L7 TTFB p95 above 2s for 10m"
          description: "Global threshold (v1, design decision 9.2) — tune per site."
          dashboard: "LoxiLB / L7 Proxy"
          panel: "TTFB p50/p95/p99"

      - alert: LoxilbAIErrorRatio
        # outcome="completed" on EVERY selector, and that is load-bearing.
        # loxilb_ai_requests_total now also counts the requests the policy gate
        # refuses, which are non-2xx by construction (401/403/429/503). Left
        # unfiltered, this critical alert would silently change meaning: a
        # rate-limit storm — today a warning via LoxilbAIRateLimitSpike — would
        # push denials into both numerator and denominator and start firing a
        # critical page, against a 5% threshold calibrated on a denominator that
        # never contained them. Filtering to completed restores exactly the
        # pre-change population, so the threshold keeps its meaning.
        expr: >-
          (
            sum(rate(loxilb_ai_requests_total{outcome="completed",status!~"2.."}[5m]))
            /
            sum(rate(loxilb_ai_requests_total{outcome="completed"}[5m]))
          ) > 0.05
          and sum(rate(loxilb_ai_requests_total{outcome="completed"}[5m])) > 0.1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "AI request backend non-2xx ratio above 5%"
          description: "Backend-answered requests only (outcome=completed); status carries the real backend HTTP status. Gate denials are excluded on purpose — they are tracked by LoxilbAIRateLimitSpike and by outcome=denied."
          dashboard: "LoxiLB / AI Gateway"
          panel: "AI requests/s by status"

      - alert: LoxilbAIRateLimitSpike
        expr: sum(rate(loxilb_ai_rate_limit_hits_total[5m])) > 10
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "AI rate-limit denials above 10/s for 5m"
          description: "Denials are counted in loxilb_ai_requests_total{outcome=\"denied\"}; this counter carries the reason they were denied, which the request total does not."
          dashboard: "LoxiLB / AI Gateway"
          panel: "Rate-limit hits/s"

  - name: loxilb-system
    rules:
      - alert: LoxilbCpuHigh
        expr: loxilb_system_cpu_utilization_percent > 90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "loxilb host CPU above 90% for 10m"
          dashboard: "LoxiLB / Overview"
          panel: "CPU / Memory / Disk"

      - alert: LoxilbMemHigh
        expr: loxilb_system_memory_utilization_percent > 90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "loxilb host memory above 90% for 10m"
          dashboard: "LoxiLB / Overview"
          panel: "CPU / Memory / Disk"

      - alert: LoxilbDiskHigh
        expr: loxilb_system_disk_utilization_percent > 90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "loxilb host disk above 90% for 10m"
          dashboard: "LoxiLB / Overview"
          panel: "CPU / Memory / Disk"

      - alert: LoxilbDiskCritical
        expr: loxilb_system_disk_utilization_percent > 95
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "loxilb host disk above 95%"
          dashboard: "LoxiLB / Overview"
          panel: "CPU / Memory / Disk"

  - name: loxilb-ha
    rules:
      - alert: LoxilbHaSyncFailing
        expr: rate(loxilb_sockproxy_sync_apply_errors_total[5m]) > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "HA sockproxy sync apply errors"
          description: "Peer state application is failing — HA correctness at risk."
          dashboard: "LoxiLB / Overview"
          panel: "HA sync errors/s"

  - name: loxilb-security
    rules:
      - alert: LoxilbSynFloodActive
        expr: rate(loxilb_security_syn_blocked_total[5m]) > 0
        for: 2m
        labels: { severity: info }
        annotations:
          summary: "SYN-flood mitigation actively blocking"
          dashboard: "LoxiLB / Security"
          panel: "SYN flood: passed vs blocked/s"

      - alert: LoxilbUdpFloodActive
        expr: rate(loxilb_security_udp_blocked_total[5m]) > 0
        for: 2m
        labels: { severity: info }
        annotations:
          summary: "UDP-flood mitigation actively blocking"
          dashboard: "LoxiLB / Security"
          panel: "UDP flood: passed vs blocked"

      - alert: LoxilbFwDropSurge
        expr: rate(loxilb_fw_drop_packets_total[5m]) > 100
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Firewall dropping more than 100 pkt/s for 5m"
          dashboard: "LoxiLB / Security"
          panel: "FW drops/s"

  - name: loxilb-capacity
    rules:
      - alert: LoxilbConntrackStatResets
        expr: rate(loxilb_conntrack_stat_resets_total[10m]) > 0
        for: 10m
        labels: { severity: info }
        annotations:
          summary: "Conntrack statistics resets occurring"
          description: "Counter baselines are churning; L4 traffic counters may briefly under-report."
          dashboard: "LoxiLB / Overview"
          panel: "Conntrack stat resets/s"

      # loxilb_conntrack_max_entries ships with rollout step 2 (design §5);
      # until the gauge exists these two rules simply evaluate to no data.
      - alert: LoxilbConntrackNearCapacity
        expr: loxilb_active_conntrack_entries / loxilb_conntrack_max_entries > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Conntrack table above 80% of capacity"
          dashboard: "LoxiLB / L4 Load Balancer"
          panel: "Conntrack entries"

      - alert: LoxilbConntrackCapacityCritical
        expr: loxilb_active_conntrack_entries / loxilb_conntrack_max_entries > 0.95
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Conntrack table above 95% of capacity — new flows will be dropped soon"
          dashboard: "LoxiLB / L4 Load Balancer"
          panel: "Conntrack entries"

  - name: loxilb-kv-attestation
    rules:
      # §7.4 escalation terminal: the data-plane contract word could not be
      # ACKed and the Go deny set is the standing fence. Exact routing is
      # safe (fenced) but the rule cannot serve Tier-1.5 until an operator
      # or a recovering setter clears the fault.
      - alert: KvExactEnforcementFault
        expr: loxilb_ai_kv_enforcement_fault > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "KV-exact rule {{ $labels.rule }} in ENFORCEMENT_FAULT — contract word unACKable, Go deny set fencing"
          description: "The dataplane contract-word transaction failed its retries. Exact scoring is fenced by the tokenize-bridge deny set (fail-closed). Investigate the eBPF datapath / proxy entry for this rule."
          dashboard: "LoxiLB / AI Gateway"
          panel: "KV attestation"

      # A strict rule stuck below READY keeps serving Tier-2 only. Fires
      # after 15m of non-READY (the ladder retries on the probe cadence).
      - alert: KvExactRuleNotReady
        expr: loxilb_ai_kv_attest_state{state!~"READY|READY_FUNCTIONAL_ONLY|LEGACY_ACTIVE_UNATTESTED"} == 1
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "KV-exact rule {{ $labels.rule }} held at {{ $labels.state }} for 15m — exact routing disabled"
          description: "The attestation ladder has not reached READY (see the rule's /kvexactstatus reasonCodes: probe failure, echo-challenge failure, manifest_missing, or peer capability mismatch)."
          dashboard: "LoxiLB / AI Gateway"
          panel: "KV attestation"

      - alert: KvExactAttestationProbeFailures
        expr: rate(loxilb_ai_kv_attest_probe_fail_total[10m]) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "KV-exact attestation probes failing ({{ $labels.reason }})"
          description: "Sustained identity/token-parity probe failures. token_mismatch means the deployed engine renders/tokenizes differently than the profile — the exact defect this system fences."
          dashboard: "LoxiLB / AI Gateway"
          panel: "KV attestation"

      - alert: KvExactEchoChallengeFailures
        expr: increase(loxilb_ai_kv_attest_echo_total{result="fail"}[30m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "KV-exact echo challenge failing"
          description: "The block-hash echo challenge (nonce-unique, per endpoint) failed — hash algorithm, block size, seed, or event-plane schema disagreement between gateway and engine."
          dashboard: "LoxiLB / AI Gateway"
          panel: "KV attestation"

  # The AI admission gate (capacity) and the process accept valve. Every
  # rate carries a traffic guard and every state alert keys on a series the
  # gate emits for every AI pool, so a pool with the gate off (all zeros)
  # or a gateway with no AI service never fires.
  - name: loxilb-ai-admission
    rules:
      - alert: LoxilbAIAdmissionShedding
        expr: |
          sum by (instance, service, pool) (rate(loxilb_ai_admission_decisions_total{reason=~"capacity_shed|queue_full"}[5m])) > 0.5
          and
          sum by (instance, service, pool) (rate(loxilb_ai_admission_decisions_total{reason="admitted"}[5m])) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "AI pool {{ $labels.service }} {{ $labels.pool }} refusing on capacity for 10m"
          description: "More than one inference request every 2 s is answered 429 on capacity while the pool keeps admitting: the pool is at its ceiling. If the adaptive ceiling is below the configured one the engines asked for it; otherwise raise the ceiling or add endpoints (runbook: docs/load-balancing/23-ai-admission-flow-control.md)."
          dashboard: "LoxiLB / AI Gateway"
          panel: "Gate decisions/s by reason"

      - alert: LoxilbAIAdmissionQueueTimeouts
        expr: sum by (instance, service, pool) (rate(loxilb_ai_admission_decisions_total{reason="queue_timeout"}[5m])) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "AI pool {{ $labels.service }} {{ $labels.pool }} ending queued requests with 504"
          description: "Requests wait their whole fc_max_queue_wait_ms and are answered 504 admission_queue_timeout: at this load the queue only delays the refusal. Shorten the wait or add capacity."
          dashboard: "LoxiLB / AI Gateway"
          panel: "Gate decisions/s by reason"

      - alert: LoxilbAIAdmissionQueueNearDepth
        expr: |
          sum by (instance, service, pool) (loxilb_ai_admission_queued)
          > 0.8 * sum by (instance, service, pool) (loxilb_ai_admission_limit{role="queue"} > 0)
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "AI pool {{ $labels.service }} {{ $labels.pool }} queue above 80% of its depth for 10m"
          description: "The queue absorbs a sustained overload, not a burst; each waiter parks about 1 MiB of client buffer. Add capacity rather than depth."
          dashboard: "LoxiLB / AI Gateway"
          panel: "Queued vs queue depth"

      - alert: LoxilbAIAdmissionAdaptiveFrozen
        expr: max by (instance, service, pool) (loxilb_ai_admission_adapt_state{state="frozen"}) == 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "AI pool {{ $labels.service }} {{ $labels.pool }} adaptive ceiling frozen on stale telemetry"
          description: "The ceiling was tightened and the engines' reports stopped (their /metrics fails or is unreachable): it is held where it was and never widened on stale data. Check the engines' /metrics and loxilb_ai_worker_scrape_total; fc_adaptive off by a replace returns the configured ceiling at once."
          dashboard: "LoxiLB / AI Gateway"
          panel: "Adaptive ceiling vs configured"

      - alert: LoxilbProxyAcceptValveBlocking
        expr: (sum by (instance) (loxilb_proxy_context_inflight) >= sum by (instance) (loxilb_proxy_accept_bound)) and on (instance) (sum by (instance) (loxilb_proxy_accept_bound) > 0)
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "loxilb holding new connections back at its context bound on {{ $labels.instance }}"
          description: "loxilb_proxy_context_inflight has held at LLB_PD_MAX_TOTAL_INFLIGHT for 5 minutes: the listeners are paused and new connections wait in the listen backlog, before any pool's admission gate. Raise the bound if memory allows, else add gateway instances."
          dashboard: "LoxiLB / AI Gateway"
          panel: "Accept valve: contexts vs bound"

      - alert: LoxilbAIAdmissionAnomaly
        expr: sum by (instance, kind) (increase(loxilb_ai_admission_anomalies_total[15m])) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "AI admission gate bookkeeping anomaly ({{ $labels.kind }})"
          description: "A capacity unit was released that was never taken (underflow) or an executing request had no pool (unknown_permit). This is a defect, not load: report it with the gateway log."
          dashboard: "LoxiLB / AI Gateway"
          panel: "Gate accounting anomalies"

  # Half-close holds: a client that half-closes after its request is held
  # open until its answer is out (half_close_mode hold, or the default mode).
  # Every family is emitted from start at zero on every gateway, so a gateway
  # where nothing is held never fires.
  - name: loxilb-halfclose
    rules:
      # A held client that never got a byte of its answer: the first byte was
      # slower than the idle bound, or the FIN was a cancel that was waited on.
      - alert: LoxilbHalfCloseHoldExpiredBeforeAnswer
        expr: sum by (instance) (increase(loxilb_proxy_halfclose_hold_expired_total{answer_started="false"}[15m])) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Half-closed client cut by the idle bound before its answer began on {{ $labels.instance }}"
          description: "A client held after its half-close got no byte of its answer for the whole idle bound (loxilb_proxy_halfclose_hold_cap_seconds) and was closed without it. Either the backend's first byte is slower than the bound (raise capSeconds on /config/halfclose) or the client's FIN was a cancel that was waited on as a half-close. Do not set defaultMode to hold while this happens (runbook: docs/load-balancing/05-rest-api-reference.md, Half-close holds)."
          dashboard: "LoxiLB / L7 Proxy"
          panel: "Hold expiries by answer and stream"

      # Should stay 0: a held client is never armed for reads.
      - alert: LoxilbHalfCloseHoldEofReentry
        expr: sum by (instance) (increase(loxilb_proxy_halfclose_hold_spurious_wakeups_total{kind="eof_reentry"}[15m])) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Held client's EOF handled again on {{ $labels.instance }}"
          description: "A client held after its half-close was woken for its EOF a second time: some path armed it for reads again. This is a defect, not load: report it with the gateway log. Block new holds (POST /netlox/v1/config/halfclose with allow false) and close the held ones (POST /netlox/v1/config/halfclose/release) if it repeats."
          dashboard: "LoxiLB / L7 Proxy"
          panel: "Held-client wake-ups, refusals, acceleration skipped"

      # A hold ends on idleness, not age, so only an answer that keeps coming
      # outlives the bound. One that also outlives an hour (and twice the
      # bound, for a site that raised it) is a slow reader being fed a byte at
      # a time, or a hold that does not end; either keeps a connection open.
      - alert: LoxilbHalfCloseHoldLongLived
        expr: max by (instance) (loxilb_proxy_halfclose_held_oldest_seconds) > on (instance) clamp_min(2 * max by (instance) (loxilb_proxy_halfclose_hold_cap_seconds), 3600)
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "A half-closed client held for over an hour on {{ $labels.instance }}"
          description: "The oldest held client has been held longer than an hour and twice the idle bound. The bound restarts with every byte written, so the client is being answered very slowly, or its hold is not ending. If the held count keeps rising too, block new holds (POST /netlox/v1/config/halfclose with allow false) and close the held ones (POST /netlox/v1/config/halfclose/release)."
          dashboard: "LoxiLB / L7 Proxy"
          panel: "Oldest hold vs idle bound"
